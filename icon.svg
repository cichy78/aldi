<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066dd"/>
      <stop offset="50%" stop-color="#003da5"/>
      <stop offset="100%" stop-color="#001f66"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9a1a"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Inner light ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Map pin -->
  <g filter="url(#sh)" transform="translate(256, 230)">
    <path d="M0,-130 C-68,-130 -115,-82 -115,-18 C-115,48 -18,115 0,155 C18,115 115,48 115,-18 C115,-82 68,-130 0,-130 Z" fill="url(#orange)"/>
    <circle cx="0" cy="-35" r="48" fill="#fff"/>
    <!-- Mini store in pin -->
    <rect x="-26" y="-48" width="52" height="36" rx="3" fill="#003da5"/>
    <path d="M-32,-48 L0,-72 L32,-48 Z" fill="#001f66"/>
    <rect x="-8" y="-20" width="16" height="18" rx="2" fill="#fff"/>
    <rect x="-18" y="-40" width="12" height="10" rx="1" fill="#7ec8ff"/>
    <rect x="6" y="-40" width="12" height="10" rx="1" fill="#7ec8ff"/>
  </g>

  <!-- ALDI VST text bar -->
  <rect x="86" y="400" width="340" height="56" rx="28" fill="rgba(0,0,0,0.25)"/>
  <text x="256" y="438" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="4">ALDI VST</text>
</svg>
