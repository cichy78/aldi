<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055c4"/>
      <stop offset="55%" stop-color="#003da5"/>
      <stop offset="100%" stop-color="#002a70"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" ry="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="5"/>
  <!-- ALDI wordmark style -->
  <text x="256" y="200" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92" fill="#ffffff" letter-spacing="6">ALDI</text>
  <!-- Orange bar under ALDI -->
  <rect x="120" y="220" width="272" height="14" rx="7" fill="url(#orange)"/>
  <!-- VST badge -->
  <g filter="url(#sh)">
    <rect x="146" y="270" width="220" height="88" rx="20" fill="url(#orange)"/>
    <text x="256" y="332" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="56" fill="#fff" letter-spacing="8">VST</text>
  </g>
  <!-- Wilsdruff hint -->
  <text x="256" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="28" fill="rgba(255,255,255,0.75)" letter-spacing="3">WILSDRUFF</text>
  <!-- small pin accent -->
  <circle cx="256" cy="460" r="8" fill="#ff8800"/>
</svg>
